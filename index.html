<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prepaid Electricity Tracker | Electra-V2</title>
    
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Chart Customizations */
        .recharts-cartesian-grid-horizontal line, .recharts-cartesian-grid-vertical line { stroke: #1e293b; }
        .recharts-default-tooltip { background-color: #0f172a !important; border: 1px solid #1e293b !important; border-radius: 12px !important; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        input:focus { outline: none; box-shadow: 0 0 0 2px #3b82f6; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        // Destructure from Global UMD Variables
        const { useState, useEffect, useMemo, useCallback } = React;
        const { 
            AreaChart, Area, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer,
            LineChart, Line
        } = Recharts;

        // --- ICONS ---
        const Plus = ({ size = 20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg>
        );
        const Zap = ({ size = 20, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></svg>
        );
        const Clock = ({ size = 20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></svg>
        );
        const Wallet = ({ size = 20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4" /><path d="M4 6v12c0 1.1.9 2 2 2h14v-4" /><path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z" /></svg>
        );
        const HistoryIcon = ({ size = 20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 3v5h5" /><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8" /></svg>
        );
        const Trash2 = ({ size = 18 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /><line x1="10" y1="11" x2="10" y2="17" /><line x1="14" y1="11" x2="14" y2="17" /></svg>
        );
        const TrendingUp = ({ size = 20, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18" /><polyline points="17 6 23 6 23 12" /></svg>
        );
        const Calendar = ({ size = 20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2" /><line x1="16" y1="2" x2="16" y2="6" /><line x1="8" y1="2" x2="8" y2="6" /><line x1="3" y1="10" x2="21" y2="10" /></svg>
        );

        // --- CALCULATION LOGIC ---
        const calculateMetrics = (readings) => {
            const defaults = {
                dailyConsumption: 0, dailyExpense: 0, monthlyConsumption: 0,
                monthlyCost: 0, estimatedCurrentUnits: 0, daysLeftUntilZero: 0
            };
            if (!readings || readings.length === 0) return defaults;
            const sorted = [...readings].sort((a, b) => new Date(a.date).getTime() - new Date(b.date).getTime());
            
            let totalConsumed = 0; let totalDays = 0; let lastIntervalRate = 0;
            if (sorted.length > 1) {
                for (let i = 0; i < sorted.length - 1; i++) {
                    const u = sorted[i].newReading - sorted[i+1].oldReading;
                    const d = Math.max(0.01, (new Date(sorted[i+1].date).getTime() - new Date(sorted[i].date).getTime()) / (1000 * 3600 * 24));
                    if (u >= 0) {
                        totalConsumed += u; totalDays += d;
                        if (i === sorted.length - 2) lastIntervalRate = u / d;
                    }
                }
            }
            const avgRate = totalDays > 0 ? totalConsumed / totalDays : 0;
            const useRate = lastIntervalRate > 0 ? lastIntervalRate : avgRate;
            const totalLoadedRands = readings.reduce((s, r) => s + r.amountLoaded, 0);
            const totalLoadedUnits = readings.reduce((s, r) => s + (r.newReading - r.oldReading), 0);
            const avgPrice = totalLoadedUnits > 0 ? totalLoadedRands / totalLoadedUnits : 0;
            const latest = sorted[sorted.length - 1];
            const timeSince = Math.max(0, (new Date().getTime() - new Date(latest.date).getTime()) / (1000 * 3600 * 24));
            const estCurrent = Math.max(0, latest.newReading - (useRate * timeSince));

            return {
                dailyConsumption: useRate,
                dailyExpense: useRate * avgPrice,
                monthlyConsumption: useRate * 30.44,
                monthlyCost: (useRate * avgPrice) * 30.44,
                estimatedCurrentUnits: estCurrent,
                daysLeftUntilZero: useRate > 0 ? estCurrent / useRate : 0
            };
        };

        // --- SUB-COMPONENTS ---
        const MetricsCard = ({ title, value, unit, icon, description, colorClass = "bg-slate-900" }) => (
            <div className={`${colorClass} p-5 rounded-3xl border border-slate-800 shadow-xl flex flex-col justify-between hover:border-slate-700 transition-all duration-300 animate-fade-in group`}>
                <div className="flex items-center justify-between mb-4">
                    <span className="text-slate-400 text-[10px] font-black uppercase tracking-widest">{title}</span>
                    <div className="p-2.5 bg-slate-800 group-hover:bg-slate-700 rounded-xl text-blue-400 transition-colors">{icon}</div>
                </div>
                <div>
                    <div className="flex items-baseline gap-1.5">
                        <span className="text-3xl font-black text-white">{typeof value === 'number' ? value.toLocaleString(undefined, { maximumFractionDigits: 1 }) : value}</span>
                        {unit && <span className="text-slate-500 text-xs font-bold uppercase">{unit}</span>}
                    </div>
                    {description && <p className="text-[10px] text-slate-500 mt-2 font-medium uppercase tracking-wider">{description}</p>}
                </div>
            </div>
        );

        const Analytics = ({ readings }) => {
            const costData = useMemo(() => [...readings].sort((a,b)=>new Date(a.date)-new Date(b.date)).map(r => ({
                ts: new Date(r.date).getTime(),
                v: (r.newReading - r.oldReading) > 0 ? r.amountLoaded / (r.newReading - r.oldReading) : 0
            })).filter(d => d.v > 0), [readings]);
            
            const useData = useMemo(() => {
                if (readings.length < 2) return [];
                const s = [...readings].sort((a,b)=>new Date(a.date)-new Date(b.date));
                const res = [];
                for(let i=1; i<s.length; i++) {
                    const d = (new Date(s[i].date)-new Date(s[i-1].date))/(1000*3600*24);
                    const u = s[i-1].newReading - s[i].oldReading;
                    if(d > 0 && u >= 0) res.push({ ts: new Date(s[i].date).getTime(), v: u/d });
                }
                return res;
            }, [readings]);

            const fmt = (ts) => new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });

            return (
                <div className="space-y-6 mt-8">
                    <div className="bg-slate-900 p-6 rounded-3xl border border-slate-800">
                        <h3 className="text-[10px] font-black text-slate-500 mb-8 uppercase tracking-[0.2em]">Unit Cost Evolution (R/kWh)</h3>
                        <div className="h-[200px] w-full">
                            <ResponsiveContainer>
                                <AreaChart data={costData}>
                                    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="5%" stopColor="#3b82f6" stopOpacity={0.3}/><stop offset="95%" stopColor="#3b82f6" stopOpacity={0}/></linearGradient></defs>
                                    <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                    <XAxis dataKey="ts" tickFormatter={fmt} stroke="#475569" fontSize={9} tickLine={false} axisLine={false} />
                                    <YAxis stroke="#475569" fontSize={9} tickLine={false} axisLine={false} tickFormatter={v=>`R${v.toFixed(1)}`} />
                                    <Tooltip labelFormatter={fmt} formatter={v=>[`R${v.toFixed(2)}`, 'Cost']} />
                                    <Area type="monotone" dataKey="v" stroke="#3b82f6" strokeWidth={3} fill="url(#g)" />
                                </AreaChart>
                            </ResponsiveContainer>
                        </div>
                    </div>
                </div>
            );
        };

        // --- APP ENTRY ---
        const App = () => {
            const [readings, setReadings] = useState([]);
            const [isModalOpen, setIsModalOpen] = useState(false);

            useEffect(() => {
                const saved = localStorage.getItem('elec_tracker_v2');
                if (saved) try { setReadings(JSON.parse(saved)); } catch (e) {}
            }, []);

            useEffect(() => { localStorage.setItem('elec_tracker_v2', JSON.stringify(readings)); }, [readings]);

            const metrics = useMemo(() => calculateMetrics(readings), [readings]);
            const sorted = useMemo(() => [...readings].sort((a,b)=>new Date(b.date)-new Date(a.date)), [readings]);

            const handleAdd = (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const or = parseFloat(fd.get('or')), al = parseFloat(fd.get('al')), nr = parseFloat(fd.get('nr'));
                if (nr > or) {
                    setReadings(prev => [...prev, { id: crypto.randomUUID(), date: fd.get('d'), oldReading: or, amountLoaded: al, newReading: nr }]);
                    setIsModalOpen(false);
                }
            };

            return (
                <div className="max-w-4xl mx-auto px-6 py-10 pb-32">
                    <header className="flex flex-col sm:flex-row justify-between items-center mb-12 gap-8">
                        <div className="text-center sm:text-left">
                            <h1 className="text-4xl font-black text-white italic tracking-tighter flex items-center gap-3">
                                <Zap className="text-yellow-400 fill-yellow-400" size={38} /> ELECTRA-V2
                            </h1>
                            <p className="text-slate-500 text-[10px] mt-2 font-black uppercase tracking-[0.2em] pl-1 opacity-70">Power Management Interface</p>
                        </div>
                        <button onClick={() => setIsModalOpen(true)} className="bg-blue-600 hover:bg-blue-500 text-white px-10 py-5 rounded-[2rem] font-black text-xs uppercase tracking-widest flex items-center gap-2 transition-all shadow-xl shadow-blue-900/40 transform active:scale-95">
                            <Plus size={18} /> New Entry
                        </button>
                    </header>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5 mb-14">
                        <MetricsCard title="Available Balance" value={metrics.estimatedCurrentUnits} unit="kWh" icon={<Zap size={18} />} description="Estimated Remaining" colorClass="bg-blue-600/10 border-blue-500/20" />
                        <MetricsCard title="Run Time" value={metrics.daysLeftUntilZero === 0 ? "N/A" : Math.floor(metrics.daysLeftUntilZero)} unit="Days" icon={<Clock size={18} />} description="Until Depletion" />
                        <MetricsCard title="Daily Cost" value={`R${metrics.dailyExpense.toFixed(2)}`} icon={<Wallet size={18} />} description="Avg Spending" />
                        <MetricsCard title="30D Projection" value={`R${metrics.monthlyCost.toFixed(2)}`} icon={<Calendar size={18} />} description="Monthly Est" />
                    </div>

                    {readings.length > 0 ? (
                        <div className="space-y-16">
                            <Analytics readings={readings} />
                            <section>
                                <h2 className="text-[11px] font-black text-slate-400 uppercase tracking-[0.25em] mb-8 px-2">History Archive</h2>
                                <div className="space-y-4">
                                    {sorted.map(r => (
                                        <div key={r.id} className="bg-slate-900/40 border border-slate-800/60 rounded-[1.5rem] p-5 flex items-center justify-between group hover:border-slate-700 transition-all">
                                            <div className="flex items-center gap-5">
                                                <div className="w-12 h-12 bg-slate-800 rounded-2xl flex flex-col items-center justify-center text-blue-400 font-black shrink-0 border border-slate-700/50">
                                                    <span className="text-[9px] uppercase leading-none opacity-50">{new Date(r.date).toLocaleString('default', {month:'short'})}</span>
                                                    <span className="text-xl leading-none">{new Date(r.date).getDate()}</span>
                                                </div>
                                                <div>
                                                    <p className="text-white font-black text-sm tracking-tight">R{r.amountLoaded.toFixed(2)} Loaded</p>
                                                    <p className="text-[10px] text-slate-500 font-bold uppercase tracking-wider mt-1">{(r.newReading - r.oldReading).toFixed(1)} kWh <span className="opacity-30 mx-1">|</span> R{(r.amountLoaded/(r.newReading - r.oldReading)).toFixed(2)}/u</p>
                                                </div>
                                            </div>
                                            <button onClick={() => setReadings(p => p.filter(x => x.id !== r.id))} className="p-3 text-slate-700 hover:text-rose-500 opacity-0 group-hover:opacity-100 transition-all"><Trash2 /></button>
                                        </div>
                                    ))}
                                </div>
                            </section>
                        </div>
                    ) : (
                        <div className="bg-slate-900/30 border-2 border-dashed border-slate-800 rounded-[3rem] p-20 text-center animate-fade-in">
                            <Zap size={64} className="mx-auto text-slate-800 mb-8 opacity-40" />
                            <h3 className="text-xl font-black text-white mb-3 uppercase tracking-widest italic">Node Offline</h3>
                            <button onClick={() => setIsModalOpen(true)} className="bg-slate-800 text-white px-10 py-4 rounded-2xl font-black text-[10px] uppercase tracking-widest transition-all">Initialize Core</button>
                        </div>
                    )}

                    {isModalOpen && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-slate-950/95 backdrop-blur-xl animate-fade-in">
                            <div className="bg-slate-900 border border-slate-800 w-full max-w-md rounded-[2.5rem] p-8 shadow-2xl">
                                <h2 className="text-2xl font-black text-white italic tracking-tight mb-8">Record Node</h2>
                                <form onSubmit={handleAdd} className="space-y-5">
                                    <input type="date" name="d" defaultValue={new Date().toISOString().split('T')[0]} className="w-full bg-slate-800 border-none rounded-2xl px-5 py-4 text-white font-bold" required />
                                    <input type="number" step="0.01" name="or" placeholder="Starting kWh" className="w-full bg-slate-800 border-none rounded-2xl px-5 py-4 text-white font-bold" required />
                                    <input type="number" step="0.01" name="al" placeholder="Spend ZAR" className="w-full bg-slate-800 border-none rounded-2xl px-5 py-4 text-white font-bold" required />
                                    <input type="number" step="0.01" name="nr" placeholder="Resulting kWh" className="w-full bg-slate-800 border-none rounded-2xl px-5 py-4 text-white font-bold" required />
                                    <div className="flex gap-4 pt-6">
                                        <button type="button" onClick={() => setIsModalOpen(false)} className="flex-1 bg-slate-800 text-slate-400 py-4 rounded-2xl font-black text-xs uppercase">Cancel</button>
                                        <button type="submit" className="flex-1 bg-blue-600 text-white py-4 rounded-2xl font-black text-xs uppercase shadow-lg shadow-blue-900/40">Confirm</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
