<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Electricity Logger</title>
  <!-- Load Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd', 400: '#60a5fa',
              500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a'
            }
          },
          animation: {
            'slide-up': 'slide-up 0.3s ease-out'
          },
          keyframes: {
            'slide-up': {
              '0%': { transform: 'translateY(10px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' }
            }
          }
        }
      }
    }
  </script>
  <!-- Load React, ReactDOM and Babel from UMD for maximum browser compatibility -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
  <style>
    body { 
      -webkit-tap-highlight-color: transparent; 
      overscroll-behavior-y: contain;
    }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 selection:bg-brand-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // --- ICONS ---
    const PlusIcon = () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" /></svg>;
    const ZapIcon = () => <svg className="w-5 h-5 text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z" clipRule="evenodd" /></svg>;
    const ClockIcon = () => <svg className="w-5 h-5 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
    const TrashIcon = () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>;

    // --- COMPONENTS ---

    const MetricCard = ({ title, value, unit, icon, colorClass = "bg-gray-900" }) => (
      <div className={`${colorClass} p-4 rounded-2xl border border-gray-800 shadow-md animate-slide-up`}>
        <div className="flex items-center justify-between mb-2">
          <span className="text-gray-500 text-[10px] font-bold uppercase tracking-widest">{title}</span>
          {icon}
        </div>
        <div className="flex items-baseline gap-1">
          <span className="text-xl font-bold text-white leading-none">{value}</span>
          <span className="text-gray-600 text-[10px] font-medium uppercase">{unit}</span>
        </div>
      </div>
    );

    const AddModal = ({ isOpen, onClose, onAdd, lastReading }) => {
      const [formData, setFormData] = useState({
        date: new Date().toISOString().split('T')[0],
        oldReading: '',
        amountLoaded: '',
        newReading: ''
      });

      useEffect(() => {
        if (isOpen) {
          setFormData({
            date: new Date().toISOString().split('T')[0],
            oldReading: lastReading ? lastReading.newReading : '',
            amountLoaded: '',
            newReading: ''
          });
        }
      }, [isOpen, lastReading]);

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        const data = {
          id: Date.now(),
          date: formData.date,
          oldReading: parseFloat(formData.oldReading),
          amountLoaded: parseFloat(formData.amountLoaded),
          newReading: parseFloat(formData.newReading)
        };
        
        if (isNaN(data.oldReading) || isNaN(data.newReading) || isNaN(data.amountLoaded)) {
          alert("Please fill in all numerical fields correctly.");
          return;
        }

        if (data.newReading <= data.oldReading) {
          alert("New reading must be higher than the old reading.");
          return;
        }
        onAdd(data);
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-4 bg-black/80 backdrop-blur-md">
          <div className="bg-gray-900 w-full max-w-md rounded-t-[2.5rem] sm:rounded-[2rem] p-8 border-t sm:border border-gray-800 shadow-2xl animate-slide-up">
            <div className="flex justify-between items-center mb-6">
              <h2 className="text-2xl font-black flex items-center gap-3">
                <span className="bg-brand-600 p-2 rounded-xl"><PlusIcon /></span> Log Purchase
              </h2>
            </div>
            <form onSubmit={handleSubmit} className="space-y-5">
              <div>
                <label className="block text-[10px] font-bold text-gray-500 mb-1.5 uppercase tracking-widest">Date</label>
                <input required type="date" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} className="w-full bg-black border border-gray-800 rounded-xl p-4 outline-none focus:ring-2 focus:ring-brand-500 transition-all font-bold" />
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div>
                  <label className="block text-[10px] font-bold text-gray-500 mb-1.5 uppercase tracking-widest">Old Units</label>
                  <input required type="number" step="0.01" value={formData.oldReading} onChange={e => setFormData({...formData, oldReading: e.target.value})} className="w-full bg-black border border-gray-800 rounded-xl p-4 outline-none focus:ring-2 focus:ring-brand-500 transition-all font-bold" />
                </div>
                <div>
                  <label className="block text-[10px] font-bold text-gray-500 mb-1.5 uppercase tracking-widest">Cost (R)</label>
                  <input required type="number" step="0.01" value={formData.amountLoaded} onChange={e => setFormData({...formData, amountLoaded: e.target.value})} className="w-full bg-black border border-gray-800 rounded-xl p-4 outline-none focus:ring-2 focus:ring-brand-500 transition-all font-bold" />
                </div>
              </div>
              <div>
                <label className="block text-[10px] font-bold text-gray-500 mb-1.5 uppercase tracking-widest">Final Units (On Meter)</label>
                <input required type="number" step="0.01" value={formData.newReading} onChange={e => setFormData({...formData, newReading: e.target.value})} className="w-full bg-black border border-gray-800 rounded-xl p-4 outline-none focus:ring-2 focus:ring-brand-500 transition-all font-bold" placeholder="Meter reading after top-up" />
              </div>
              <div className="flex gap-3 pt-6">
                <button type="button" onClick={onClose} className="flex-1 bg-gray-800 hover:bg-gray-700 font-black py-4 rounded-2xl transition-all">Cancel</button>
                <button type="submit" className="flex-1 bg-brand-600 hover:bg-brand-500 font-black py-4 rounded-2xl shadow-xl shadow-brand-900/40 transition-all active:scale-95">Save</button>
              </div>
            </form>
          </div>
        </div>
      );
    };

    // --- MAIN APP ---

    const App = () => {
      const [readings, setReadings] = useState(() => {
        try {
          const saved = localStorage.getItem('elec_logger_data_v2');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });
      const [isModalOpen, setIsModalOpen] = useState(false);

      useEffect(() => {
        localStorage.setItem('elec_logger_data_v2', JSON.stringify(readings));
      }, [readings]);

      const metrics = useMemo(() => {
        if (readings.length === 0) return null;
        
        const sorted = [...readings].sort((a, b) => new Date(a.date) - new Date(b.date));
        const latest = sorted[sorted.length - 1];
        
        let totalUnitsUsed = 0;
        let totalDaysElapsed = 0;
        
        for (let i = 0; i < sorted.length - 1; i++) {
          const curr = sorted[i];
          const next = sorted[i+1];
          const unitsUsed = curr.newReading - next.oldReading;
          const days = (new Date(next.date) - new Date(curr.date)) / (1000 * 3600 * 24);
          if (unitsUsed > 0 && days > 0) {
            totalUnitsUsed += unitsUsed;
            totalDaysElapsed += days;
          }
        }

        const avgDailyUnits = totalDaysElapsed > 0 ? totalUnitsUsed / totalDaysElapsed : 0;
        const totalRands = sorted.reduce((sum, r) => sum + r.amountLoaded, 0);
        const totalUnits = sorted.reduce((sum, r) => sum + (r.newReading - r.oldReading), 0);
        const avgCostPerUnit = totalUnits > 0 ? totalRands / totalUnits : 0;
        const avgDailyCost = avgDailyUnits * avgCostPerUnit;

        const daysSinceLastReading = Math.max(0, (new Date() - new Date(latest.date)) / (1000 * 3600 * 24));
        const estimatedCurrentUnits = Math.max(0, latest.newReading - (avgDailyUnits * daysSinceLastReading));
        
        const daysLeft = avgDailyUnits > 0 ? estimatedCurrentUnits / avgDailyUnits : 0;
        const daysTo100 = avgDailyUnits > 0 ? (estimatedCurrentUnits - 100) / avgDailyUnits : 0;

        return {
          currentUnits: estimatedCurrentUnits,
          avgDailyUnits,
          avgDailyCost,
          daysLeft,
          daysTo100,
          totalPurchases: sorted.length,
          latestEntry: latest
        };
      }, [readings]);

      const deleteReading = (id) => {
        if (confirm("Delete this entry forever?")) {
          setReadings(prev => prev.filter(r => r.id !== id));
        }
      };

      return (
        <div className="min-h-screen px-6 py-10 max-w-xl mx-auto pb-32">
          <header className="flex justify-between items-center mb-10">
            <div>
              <h1 className="text-4xl font-black text-white tracking-tighter leading-none">POWER<br/><span className="text-brand-500">LOG</span></h1>
            </div>
            <button 
              onClick={() => setIsModalOpen(true)}
              className="bg-brand-600 hover:bg-brand-500 text-white p-4 rounded-2xl shadow-2xl shadow-brand-900/60 active:scale-90 transition-all"
            >
              <PlusIcon />
            </button>
          </header>

          {!metrics ? (
            <div className="bg-gray-900/50 rounded-[2.5rem] p-16 text-center border-2 border-dashed border-gray-900 animate-slide-up">
              <div className="bg-gray-800 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-6">
                <ZapIcon />
              </div>
              <p className="text-gray-500 font-bold uppercase tracking-widest text-xs">No Data Found</p>
              <p className="mt-2 text-gray-400 text-sm">Tap the + to add your first purchase.</p>
            </div>
          ) : (
            <div className="space-y-6">
              {/* STATUS DASHBOARD */}
              <div className="bg-brand-600 rounded-[2.5rem] p-8 shadow-2xl shadow-brand-900/30 relative overflow-hidden">
                <div className="absolute top-0 right-0 p-8 opacity-20 transform translate-x-4 -translate-y-4">
                  <ZapIcon />
                </div>
                <p className="text-brand-200 text-[10px] font-black uppercase tracking-[0.2em] mb-2">Estimated Balance</p>
                <div className="flex items-baseline gap-3">
                  <h2 className="text-7xl font-black text-white tracking-tighter">{metrics.currentUnits.toFixed(1)}</h2>
                  <span className="text-brand-200 font-black text-sm">UNITS</span>
                </div>
                
                <div className="grid grid-cols-2 gap-6 mt-8 pt-8 border-t border-brand-500/50">
                  <div>
                    <p className="text-brand-200 text-[10px] font-black uppercase tracking-widest mb-1">Time Left</p>
                    <p className="text-white font-black text-xl">{Math.ceil(metrics.daysLeft)} <span className="text-sm font-bold opacity-70">Days</span></p>
                  </div>
                  <div>
                    <p className="text-brand-200 text-[10px] font-black uppercase tracking-widest mb-1">Until 100u</p>
                    <p className="text-white font-black text-xl">{metrics.daysTo100 > 0 ? Math.floor(metrics.daysTo100) : 0} <span className="text-sm font-bold opacity-70">Days</span></p>
                  </div>
                </div>
              </div>

              {/* STATS GRID */}
              <div className="grid grid-cols-2 gap-4">
                <MetricCard title="Daily Use" value={metrics.avgDailyUnits.toFixed(1)} unit="Units" icon={<ZapIcon />} />
                <MetricCard title="Daily Cost" value={`R${metrics.avgDailyCost.toFixed(2)}`} unit="Cost" icon={<ClockIcon />} />
                <MetricCard title="Monthly Use" value={(metrics.avgDailyUnits * 30.4).toFixed(0)} unit="Units" />
                <MetricCard title="Monthly Cost" value={`R${(metrics.avgDailyCost * 30.4).toFixed(0)}`} unit="Cost" />
              </div>

              {/* RECENT HISTORY */}
              <div className="mt-12">
                <h3 className="text-gray-600 text-[10px] font-black uppercase tracking-[0.3em] mb-6 ml-1">History</h3>
                <div className="space-y-4">
                  {[...readings].sort((a,b) => new Date(b.date) - new Date(a.date)).map(r => (
                    <div key={r.id} className="bg-gray-900 p-5 rounded-3xl border border-gray-800 flex items-center justify-between group active:bg-gray-800 transition-all">
                      <div>
                        <p className="font-black text-white text-sm">{new Date(r.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })}</p>
                        <p className="text-gray-600 text-[10px] font-bold uppercase mt-1 tracking-widest">
                          +{(r.newReading - r.oldReading).toFixed(1)} Units Added
                        </p>
                      </div>
                      <div className="flex items-center gap-4">
                        <span className="text-brand-500 font-black text-lg">R{r.amountLoaded}</span>
                        <button onClick={() => deleteReading(r.id)} className="text-gray-800 hover:text-red-500 p-2">
                          <TrashIcon />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          <AddModal 
            isOpen={isModalOpen} 
            onClose={() => setIsModalOpen(false)} 
            onAdd={r => setReadings(prev => [...prev, r])}
            lastReading={metrics ? metrics.latestEntry : null}
          />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
