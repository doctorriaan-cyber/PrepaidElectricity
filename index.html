
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prepaid Water Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel Standalone for Single File Functionality -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'brand-blue': {
                '50': '#eff6ff', '100': '#dbeafe', '200': '#bfdbfe', '300': '#93c5fd',
                '400': '#60a5fa', '500': '#3b82f6', '600': '#2563eb', '700': '#1d4ed8',
                '800': '#1e40af', '900': '#1e3a8a', '950': '#172554',
              },
            },
            keyframes: {
              'fade-in': {
                '0%': { opacity: '0', transform: 'scale(0.95)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
            },
            animation: {
              'fade-in': 'fade-in 0.2s ease-out forwards',
            },
          }
        }
      }
    </script>
    <style>
        body { background-color: #111827; color: #f3f4f6; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, Fragment } = React;

        // =============================================
        // ICONS (SVG Components)
        // =============================================
        const PlusIcon = (props) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        );

        const DollarSignIcon = (props) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
            <line x1="12" y1="1" x2="12" y2="23"></line>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
          </svg>
        );

        const DropletIcon = (props) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
            <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0L12 2.69z"></path>
          </svg>
        );

        const CalendarIcon = (props) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
        );

        const TrendingUpIcon = (props) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
            <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
            <polyline points="17 6 23 6 23 12"></polyline>
          </svg>
        );

        const ClockIcon = (props) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
        );

        const GlassWaterIcon = (props) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
                <path d="M4.5 3h15"></path>
                <path d="M6 3v16a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V3"></path>
                <path d="M6 14h12"></path>
            </svg>
        );

        const TrashIcon = (props) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              <line x1="10" y1="11" x2="10" y2="17"></line>
              <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
        );

        const AlertTriangleIcon = (props) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                <line x1="12" y1="9" x2="12" y2="13"></line>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
        );

        const SortIcon = (props) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
                <path d="m3 16 4 4 4-4"/>
                <path d="M7 20V4"/>
                <path d="m21 8-4-4-4 4"/>
                <path d="M17 4v16"/>
            </svg>
        );

        // =============================================
        // CHART UTILS
        // =============================================
        const CHART_PADDING = { top: 20, right: 30, bottom: 45, left: 45 };
        const CHART_SVG_WIDTH = 500;
        const CHART_SVG_HEIGHT = 180;
        const CHART_WIDTH = CHART_SVG_WIDTH - CHART_PADDING.left - CHART_PADDING.right;
        const CHART_HEIGHT = CHART_SVG_HEIGHT - CHART_PADDING.top - CHART_PADDING.bottom;

        const getXScale = (readings) => {
            if (!readings || readings.length === 0) return () => CHART_PADDING.left;
            const chronoSorted = [...readings].sort((a, b) => new Date(a.date).getTime() - new Date(b.date).getTime());
            const minTime = new Date(chronoSorted[0].date).getTime();
            const maxTime = new Date(chronoSorted[chronoSorted.length - 1].date).getTime();
            const range = (maxTime - minTime) || 1;
            return (time) => CHART_PADDING.left + ((new Date(time).getTime() - minTime) / range) * CHART_WIDTH;
        };

        // =============================================
        // COMPONENTS
        // =============================================

        const MetricCard = ({ icon, title, value, unit, color }) => (
          <div className="bg-gray-800 p-4 rounded-xl flex items-center gap-4 shadow-lg border border-gray-700">
            <div className={`p-3 rounded-full ${color}`}>{icon}</div>
            <div className="overflow-hidden">
              <p className="text-sm text-gray-400 truncate">{title}</p>
              <p className="text-xl font-bold text-white whitespace-nowrap">
                {value} <span className="text-xs font-normal text-gray-400">{unit}</span>
              </p>
            </div>
          </div>
        );

        const TrendGraph = ({ readings, averageCostPerUnit }) => {
            const chronoSortedReadings = useMemo(() => {
                return [...readings].sort((a, b) => new Date(a.date).getTime() - new Date(b.date).getTime());
            }, [readings]);

            const chartData = useMemo(() => {
                return chronoSortedReadings.map(r => ({
                    date: r.date,
                    costPerKl: r.newReading > r.oldReading ? r.amountLoaded / (r.newReading - r.oldReading) : 0,
                }));
            }, [chronoSortedReadings]);

            if (chartData.length < 2) return null;

            const yValues = chartData.map(d => d.costPerKl);
            const rawMin = Math.min(...yValues, averageCostPerUnit);
            const rawMax = Math.max(...yValues, averageCostPerUnit);
            const buffer = (rawMax - rawMin) * 0.1 || 1.0;
            const yMin = rawMin - buffer;
            const yMax = rawMax + buffer;
            const yRange = (yMax - yMin) || 1;

            const getX = getXScale(readings);
            const getY = (value) => CHART_PADDING.top + CHART_HEIGHT - ((value - yMin) / yRange) * CHART_HEIGHT;
            const avgY = getY(averageCostPerUnit);

            const pathData = chartData.map((d, i) => `${i === 0 ? 'M' : 'L'} ${getX(d.date)} ${getY(d.costPerKl)}`).join(' ');

            return (
                <div className="bg-gray-800 p-4 rounded-xl mt-8 border border-gray-700">
                    <h3 className="text-sm font-semibold text-gray-400 mb-4 px-2 uppercase tracking-wider">Cost per kl Trend</h3>
                    <svg viewBox={`0 0 ${CHART_SVG_WIDTH} ${CHART_SVG_HEIGHT}`} className="w-full h-auto">
                        <line x1={CHART_PADDING.left} y1={avgY} x2={CHART_SVG_WIDTH - CHART_PADDING.right} y2={avgY} strokeDasharray="4 4" stroke="#3b82f6" strokeWidth="1" opacity="0.5" />
                        <path d={pathData} fill="none" stroke="#60a5fa" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
                        {chartData.map((d, i) => (
                            <circle key={i} cx={getX(d.date)} cy={getY(d.costPerKl)} r="3" fill="#60a5fa" />
                        ))}
                    </svg>
                </div>
            );
        };

        const InputField = ({ id, label, type, value, onChange, error, placeholder = '' }) => (
          <div>
              <label htmlFor={id} className="block text-sm font-medium text-gray-300 mb-1">{label}</label>
              <input
                id={id} type={type} value={value} onChange={onChange} placeholder={placeholder}
                className={`w-full bg-gray-700 text-white rounded-md p-2 border ${error ? 'border-red-500' : 'border-gray-600'} focus:ring-2 focus:ring-brand-blue-500 outline-none`}
              />
              {error && <p className="text-red-500 text-xs mt-1">{error}</p>}
          </div>
        );

        // =============================================
        // MAIN APP
        // =============================================
        const App = () => {
            const [readings, setReadings] = useState([]);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [formData, setFormData] = useState({ date: '', oldReading: '', amountLoaded: '', newReading: '' });
            const [errors, setErrors] = useState({});
            const [sortOrder, setSortOrder] = useState('desc');

            useEffect(() => {
                const stored = localStorage.getItem('waterReadings');
                if (stored) setReadings(JSON.parse(stored));
            }, []);

            useEffect(() => {
                localStorage.setItem('waterReadings', JSON.stringify(readings));
            }, [readings]);

            const metrics = useMemo(() => {
                if (readings.length < 2) return { dailyExpense: 0, dailyConsumption: 0, costPerUnit: 0, monthlyCost: 0, monthlyConsumption: 0, estimatedDaysLeft: Infinity, calculatedCurrentUnits: readings.length ? readings[0].newReading : 0 };
                const chrono = [...readings].sort((a, b) => new Date(a.date).getTime() - new Date(b.date).getTime());
                let totalU = 0, totalD = 0;
                for (let i = 0; i < chrono.length - 1; i++) {
                    const consumed = chrono[i].newReading - chrono[i+1].oldReading;
                    if (consumed > 0) {
                        totalU += consumed;
                        totalD += (new Date(chrono[i+1].date).getTime() - new Date(chrono[i].date).getTime()) / 86400000;
                    }
                }
                const totalR = readings.reduce((s, r) => s + r.amountLoaded, 0);
                const totalL = readings.reduce((s, r) => s + (r.newReading - r.oldReading), 0);
                const cpU = totalL > 0 ? totalR / totalL : 0;
                const dC = totalD > 0 ? totalU / totalD : 0;
                const latest = chrono[chrono.length-1];
                const daysSince = Math.max(0, (Date.now() - new Date(latest.date).getTime()) / 86400000);
                const currU = Math.max(0, latest.newReading - (dC * daysSince));
                return { dailyExpense: dC * cpU, dailyConsumption: dC, costPerUnit: cpU, monthlyCost: dC * cpU * 30.44, monthlyConsumption: dC * 30.44, estimatedDaysLeft: dC > 0 ? currU / dC : Infinity, calculatedCurrentUnits: currU };
            }, [readings]);

            const sortedReadings = useMemo(() => {
                return [...readings].sort((a, b) => sortOrder === 'desc' ? new Date(b.date) - new Date(a.date) : new Date(a.date) - new Date(b.date));
            }, [readings, sortOrder]);

            const handleAdd = (e) => {
                e.preventDefault();
                const newErrors = {};
                const { date, oldReading, amountLoaded, newReading } = formData;
                if (!date) newErrors.date = 'Required';
                if (isNaN(oldReading) || oldReading < 0) newErrors.oldReading = 'Invalid';
                if (isNaN(amountLoaded) || amountLoaded <= 0) newErrors.amountLoaded = 'Invalid';
                if (isNaN(newReading) || newReading <= oldReading) newErrors.newReading = 'Must be > Old';
                
                if (Object.keys(newErrors).length === 0) {
                    setReadings([...readings, { ...formData, id: Date.now(), 
                        oldReading: parseFloat(oldReading), 
                        amountLoaded: parseFloat(amountLoaded), 
                        newReading: parseFloat(newReading) 
                    }]);
                    setIsModalOpen(false);
                    setFormData({ date: '', oldReading: '', amountLoaded: '', newReading: '' });
                } else setErrors(newErrors);
            };

            return (
                <div className="max-w-2xl mx-auto p-4 sm:p-6 min-h-screen">
                    <header className="flex justify-between items-center mb-8">
                        <h1 className="text-3xl font-bold text-white"><span className="text-brand-blue-400">Prepaid</span> Water</h1>
                        <button onClick={() => setIsModalOpen(true)} className="bg-brand-blue-600 hover:bg-brand-blue-700 p-2 px-4 rounded-lg flex items-center gap-2 transition-all shadow-lg active:scale-95">
                            <PlusIcon className="w-5 h-5" /> <span>Add Refill</span>
                        </button>
                    </header>

                    <div className="grid grid-cols-2 md:grid-cols-3 gap-4 mb-8">
                        <MetricCard icon={<GlassWaterIcon className="w-6 h-6"/>} title="Current Balance" value={metrics.calculatedCurrentUnits.toFixed(2)} unit="kl" color="bg-green-500/80"/>
                        <MetricCard icon={<ClockIcon className="w-6 h-6"/>} title="Est. Refill In" value={isFinite(metrics.estimatedDaysLeft) ? Math.floor(metrics.estimatedDaysLeft) : '∞'} unit="days" color="bg-yellow-500/80"/>
                        <MetricCard icon={<DropletIcon className="w-6 h-6"/>} title="Daily Use" value={metrics.dailyConsumption.toFixed(2)} unit="kl" color="bg-blue-500/80"/>
                        <MetricCard icon={<DollarSignIcon className="w-6 h-6"/>} title="Daily Cost" value={`R ${metrics.dailyExpense.toFixed(2)}`} unit="" color="bg-red-500/80"/>
                        <MetricCard icon={<CalendarIcon className="w-6 h-6"/>} title="Monthly Cost" value={`R ${metrics.monthlyCost.toFixed(2)}`} unit="" color="bg-indigo-500/80"/>
                        <MetricCard icon={<TrendingUpIcon className="w-6 h-6"/>} title="Cost / kl" value={`R ${metrics.costPerUnit.toFixed(2)}`} unit="" color="bg-purple-500/80"/>
                    </div>

                    <TrendGraph readings={readings} averageCostPerUnit={metrics.costPerUnit} />

                    <div className="mt-12">
                        <div className="flex justify-between items-center mb-4 border-b border-gray-700 pb-2">
                            <h2 className="text-xl font-bold text-gray-200">Refill History</h2>
                            <button onClick={() => setSortOrder(sortOrder === 'desc' ? 'asc' : 'desc')} className="text-gray-400 hover:text-white flex items-center gap-1 text-sm">
                                <SortIcon className="w-4 h-4" /> {sortOrder === 'desc' ? 'Newest' : 'Oldest'}
                            </button>
                        </div>
                        <div className="space-y-4">
                            {sortedReadings.map((r, i) => (
                                <div key={r.id} className="bg-gray-800 p-4 rounded-xl border border-gray-700 flex justify-between items-center animate-fade-in">
                                    <div>
                                        <p className="text-sm text-gray-400">{new Date(r.date).toLocaleDateString()}</p>
                                        <p className="font-bold text-lg text-white">R {r.amountLoaded.toFixed(2)}</p>
                                    </div>
                                    <div className="text-right">
                                        <p className="text-xs text-gray-400 uppercase">Usage Span</p>
                                        <p className="text-brand-blue-400 font-medium">{(r.newReading - r.oldReading).toFixed(2)} kl</p>
                                    </div>
                                    <button onClick={() => setReadings(readings.filter(rd => rd.id !== r.id))} className="text-gray-600 hover:text-red-500 p-2">
                                        <TrashIcon className="w-4 h-4" />
                                    </button>
                                </div>
                            ))}
                            {readings.length === 0 && <p className="text-center text-gray-500 py-10">No readings yet. Add your first refill to start tracking.</p>}
                        </div>
                    </div>

                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <form onSubmit={handleAdd} className="bg-gray-800 w-full max-w-md p-6 rounded-2xl border border-gray-700 shadow-2xl animate-fade-in space-y-4">
                                <h2 className="text-2xl font-bold text-white mb-6">New Refill</h2>
                                <InputField id="date" label="Refill Date" type="date" value={formData.date} onChange={e => setFormData({...formData, date: e.target.value})} error={errors.date} />
                                <InputField id="oldReading" label="Units Before (kl)" type="number" step="0.01" value={formData.oldReading} onChange={e => setFormData({...formData, oldReading: e.target.value})} error={errors.oldReading} placeholder="0.00" />
                                <InputField id="amountLoaded" label="Cost (Rands)" type="number" step="0.01" value={formData.amountLoaded} onChange={e => setFormData({...formData, amountLoaded: e.target.value})} error={errors.amountLoaded} placeholder="200.00" />
                                <InputField id="newReading" label="Units After (kl)" type="number" step="0.01" value={formData.newReading} onChange={e => setFormData({...formData, newReading: e.target.value})} error={errors.newReading} placeholder="10.00" />
                                <div className="flex gap-4 pt-4">
                                    <button type="button" onClick={() => setIsModalOpen(false)} className="flex-1 bg-gray-700 p-3 rounded-xl hover:bg-gray-600 transition">Cancel</button>
                                    <button type="submit" className="flex-1 bg-brand-blue-600 p-3 rounded-xl font-bold hover:bg-brand-blue-500 transition">Save</button>
                                </div>
                            </form>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
